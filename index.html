<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Dept Calendar 2026-2027</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background Orbs for Glassmorphism Effect -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <header class="glass-header">
        <div class="header-content">
            <h1>IT Department Programme Calendar</h1>
            <p>Academic Year 2026 - 2027</p>
        </div>

    </header>

    <main class="dashboard-layout">
        <aside class="sidebar-panel">
            <div id="month-controls" class="month-controls">
                <button id="prev-month-btn" class="nav-btn">&larr;</button>
                <h2 id="current-month-title" class="month-title">Month Year</h2>
                <button id="next-month-btn" class="nav-btn">&rarr;</button>
            </div>
            <div id="calendar-container">
                <!-- Mini calendar rendered via JS -->
            </div>
        </aside>
        <section class="details-panel" id="event-details-container">
            <div class="empty-state">
                <p>Select a date on the calendar to view event details.</p>
            </div>
        </section>
    </main>


    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
